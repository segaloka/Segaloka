name: Dashboard Build Check

on:
  push:
    branches:
      - refactor/separate-role-dashboards
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build separated dashboards
        id: dashboard_build
        shell: bash
        run: |
          chmod +x build.sh
          set +e
          bash -x build.sh > dashboard-build.log 2>&1
          status=$?
          cat dashboard-build.log
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Browser runtime smoke test
        id: runtime_smoke
        if: steps.dashboard_build.outputs.exit_code == '0'
        shell: bash
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
          set +e
          node tests/bundle-smoke.js 2>&1 | tee runtime-smoke.log
          status=${PIPESTATUS[0]}
          echo "smoke_exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload runtime smoke diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-smoke-log
          path: runtime-smoke.log
          if-no-files-found: warn

      - name: Fail when runtime smoke failed
        if: steps.runtime_smoke.outputs.smoke_exit_code != '0'
        run: exit 1

      - name: Upload build diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-build-log
          path: dashboard-build.log
          if-no-files-found: error
      - name: Fail when build failed
        if: steps.dashboard_build.outputs.exit_code != '0'
        run: |
          echo "Dashboard build failed with exit code ${{ steps.dashboard_build.outputs.exit_code }}"
          exit 1
